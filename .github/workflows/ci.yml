name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pemindaian rahasia di SELURUH riwayat git, dengan binary gitleaks yang sama dengan hook pre-commit.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: node scripts/gitleaks.mjs git --redact --no-banner --verbose

  test:
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Lint, format, typecheck, tes unit (termasuk .env.example hanya placeholder)
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test:unit

      - name: Supabase lokal (secret job device-cleanup dibuat acak per run, tidak pernah di repo)
        run: |
          node scripts/local-secrets.mjs --env
          pnpm exec supabase start -x studio,mailpit,imgproxy,logflare,vector,supavisor
          node scripts/local-secrets.mjs --vault

      - name: Tipe DB tidak basi
        run: node scripts/gen-db-types.mjs --check

      - name: pgTAP (RLS, hak akses, RPC)
        run: pnpm db:test

      - name: Tes integrasi
        run: pnpm test:integration

      - name: Simulator check-in (14 langkah + batas karantina)
        run: pnpm sim -- --scenario quarantine-limit

      - name: Dashboard (svelte-check + Playwright)
        working-directory: apps/dashboard
        run: |
          pnpm exec playwright install --with-deps chromium
          node ../../scripts/local-supabase-env.mjs -- pnpm check
          pnpm test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report
          retention-days: 7
